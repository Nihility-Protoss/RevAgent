[project]
name = "multi-agent-adk"
version = "0.1.0"
description = "Malware analysis multi-agent system using LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Web UI 接口测试（FastAPI TestClient 依赖 httpx，进程内运行不占真实端口）
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 应用型仓库：不需要把 tools/workers 等目录安装为包，仅需安装依赖
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
